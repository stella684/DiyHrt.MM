<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DIYHRT MM</title>
    
    <!-- Modern fonts for better readability -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Padauk:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            /* Sleek Dark Mode Palette */
            --bg: #0d1117;
            --surface: #161b22;
            --surface-hover: #21262d;
            --text-primary: #e6edf3;
            --text-secondary: #8b949e;
            
            /* Thematic Accents (Pastel Blue & Pink) */
            --accent-blue: #58a6ff;
            --accent-pink: #ff7b72;
            --warning-bg: #4d3a00;
            --warning-text: #e3b341;
            --border: #30363d;
        }

        body {
            font-family: 'Inter', 'Padauk', system-ui, sans-serif;
            background-color: var(--bg);
            color: var(--text-primary);
            margin: 0;
            line-height: 1.7;
            display: flex;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-secondary); }

        /* Sidebar Navigation */
        nav {
            width: 300px;
            background-color: var(--surface);
            border-right: 1px solid var(--border);
            padding: 24px;
            box-sizing: border-box;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            position: sticky;
            top: 0;
            height: 100vh;
        }

        .brand-container {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 30px;
            text-decoration: none;
            cursor: pointer;
        }

        .brand-icon {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            object-fit: cover;
        }

        .brand-text {
            font-weight: 800;
            font-size: 1.4rem;
            background: linear-gradient(90deg, var(--accent-blue), var(--accent-pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }

        .category-title {
            text-transform: uppercase;
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin: 20px 0 10px 0;
            font-weight: 700;
            letter-spacing: 1.5px;
        }

        nav a.menu-link {
            display: block;
            color: var(--text-primary);
            text-decoration: none;
            padding: 10px 14px;
            border-radius: 6px;
            margin-bottom: 6px;
            transition: all 0.2s ease;
            font-size: 0.95rem;
            border: 1px solid transparent;
        }

        nav a.menu-link:hover, nav a.menu-link.active {
            background-color: var(--surface-hover);
            border-color: var(--border);
            color: var(--accent-blue);
            transform: translateX(4px);
        }

        /* Main Content Area */
        main {
            flex-grow: 1;
            padding: 50px;
            max-width: 850px;
            margin: 0 auto;
        }

        #home-content { display: block; animation: fadeIn 0.4s ease-out; }
        #txt-content-wrapper { display: none; animation: fadeIn 0.4s ease-out; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Rendered Text Styling applied to fetched .txt files */
        .alert-box {
            background-color: var(--warning-bg);
            color: var(--warning-text);
            padding: 16px 20px;
            border-radius: 8px;
            border-left: 4px solid var(--warning-text);
            margin-bottom: 30px;
            font-weight: 600;
        }

        #page-title {
            font-size: 2.2rem;
            color: var(--text-primary);
            margin-bottom: 40px;
            line-height: 1.3;
            margin-top: 0;
        }

        .section-title {
            color: var(--accent-blue);
            margin-top: 50px;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border);
            font-size: 1.5rem;
        }

        .step-num {
            background: var(--accent-blue);
            color: var(--bg);
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 1.1rem;
            margin-right: 8px;
        }

        .sub-title {
            color: var(--accent-pink);
            margin-top: 35px;
            margin-bottom: 15px;
            font-size: 1.2rem;
            font-weight: bold;
        }

        .text-body p {
            margin-bottom: 1.2rem;
            color: #c9d1d9;
        }

        .list-item {
            margin-bottom: 8px;
            padding-left: 20px;
            position: relative;
            color: #c9d1d9;
        }

        .list-item::before {
            content: "•";
            position: absolute;
            left: 0;
            color: var(--accent-blue);
            font-weight: bold;
        }

        a.external-link {
            color: var(--accent-blue);
            text-decoration: none;
            border-bottom: 1px dotted var(--accent-blue);
            transition: color 0.2s;
        }

        a.external-link:hover {
            color: var(--accent-pink);
            border-bottom-color: var(--accent-pink);
        }

        /* Mobile Adjustments */
        @media (max-width: 800px) {
            body { flex-direction: column; }
            nav {
                width: 100%;
                height: auto;
                position: relative;
                border-right: none;
                border-bottom: 1px solid var(--border);
            }
            main { padding: 30px 20px; }
            #page-title { font-size: 1.8rem; }
        }
    </style>
</head>
<body>

    <nav>
        <div class="brand-container" onclick="goHome(event)">
            <!-- Icon loads from your root folder. Safe fallback if missing -->
            <img src="icon.png" alt="Icon" class="brand-icon" onerror="this.style.display='none'">
            <span class="brand-text">DIYHRT MM</span>
        </div>

        <div class="category-title">Guide</div>
        <a href="/guide/01" class="menu-link" onclick="loadPage(event, 'guide', '01', 'Transfeminine HRT Guide')">Transfeminine HRT Sublingual/Buccal</a>
        <a href="/guide/02" class="menu-link" onclick="loadPage(event, 'guide', '02', 'Blood Test လမ်းညွှန်ချက်များ')">Blood Test လမ်းညွှန်ချက်များ</a>

        <div class="category-title">About</div>
        <a href="/about/01" class="menu-link" onclick="loadPage(event, 'about', '01', 'ဆက်သွယ်ရန် / ဝယ်ယူရန်')">ဆက်သွယ်ရန် / ဝယ်ယူရန်</a>
    </nav>

    <main>
        <!-- Homepage View -->
        <div id="home-content">
            <h1 style="color: var(--text-primary); font-size: 2.2rem;">Welcome to DIYHRT MM</h1>
            <p style="color: var(--text-secondary); font-size: 1.1rem;">Select a guide from the menu to read the documentation.</p>
        </div>

        <!-- Document View -->
        <div id="txt-content-wrapper">
            <h1 id="page-title"></h1>
            <div id="text-container" class="text-body">Loading...</div>
        </div>
    </main>

    <script>
        // Formatting Engine: Converts your specific .txt format to HTML safely
        function parseTextToHTML(text) {
            // Remove the title from the .txt body if it matches the header (optional cleanup)
            const lines = text.split('\n');
            if(lines.length > 2 && lines[2].includes('Transfeminine')) {
                text = text.replace(lines[2], ''); 
            }

            // Format Warning Disclaimer
            text = text.replace(/⚠️(.*?)\n/g, '<div class="alert-box">⚠️ $1</div>');

            // Format Main Headings [1] Estrogen
            text = text.replace(/^\[(\d+)\]\s*(.*)$/gm, '<h2 class="section-title"><span class="step-num">$1</span> $2</h2>');

            // Format Sub Headings [ sublingual/buccal... ]
            text = text.replace(/^\[\s*([^\]]+?)\s*\]$/gm, '<div class="sub-title">$1</div>');

            // Format Bullet Points (• or -)
            text = text.replace(/^[•\-]\s+(.*)$/gm, '<div class="list-item">$1</div>');

            // Format Links & Telegram Handles
            text = text.replace(/(https?:\/\/[^\s\)]+)/g, '<a href="$1" class="external-link" target="_blank" rel="noopener noreferrer">$1</a>');
            text = text.replace(/t\.me\/@?([a-zA-Z0-9_]+)/g, '<a href="https://t.me/$1" class="external-link" target="_blank" rel="noopener noreferrer">t.me/$1</a>');

            // Wrap regular text blocks in Paragraph tags
            let htmlChunks = text.split(/\n{2,}/).map(chunk => {
                if (chunk.trim() === '') return '';
                if (chunk.trim().startsWith('<') && !chunk.trim().startsWith('<strong') && !chunk.trim().startsWith('<a')) {
                    return chunk; // It's already parsed HTML
                }
                return `<p>${chunk.replace(/\n/g, '<br>')}</p>`;
            });

            return htmlChunks.join('');
        }

        // Core Function to fetch and load .txt files
        async function loadPage(event, category, fileId, title) {
            if (event) event.preventDefault();

            const homeWrapper = document.getElementById('home-content');
            const txtWrapper = document.getElementById('txt-content-wrapper');
            const txtContainer = document.getElementById('text-container');
            const titleEl = document.getElementById('page-title');

            // Update UI State
            homeWrapper.style.display = 'none';
            txtWrapper.style.display = 'block';
            titleEl.textContent = title;
            txtContainer.innerHTML = "<p>Loading file...</p>";
            document.title = title + " - DIYHRT MM";

            // Update URL without reloading
            window.history.pushState({category, fileId, title}, '', `/${category}/${fileId}`);

            // Fetch the text file from the folder structure
            try {
                const response = await fetch(`/txt/${category}/${fileId}.txt`);
                if (!response.ok) throw new Error('File not found on server.');
                
                const rawText = await response.text();
                // Pass the fetched text through the formatting engine
                txtContainer.innerHTML = parseTextToHTML(rawText);
                
            } catch (error) {
                txtContainer.innerHTML = `<div class="alert-box">Error: Could not load the text file. Please make sure <strong>/txt/${category}/${fileId}.txt</strong> exists on your server.</div>`;
            }

            // Update active state in menu
            document.querySelectorAll('.menu-link').forEach(link => link.classList.remove('active'));
            if(event && event.target) {
                event.target.classList.add('active');
            }
        }

        // Return to home state
        function goHome(event) {
            if (event) event.preventDefault();
            document.getElementById('home-content').style.display = 'block';
            document.getElementById('txt-content-wrapper').style.display = 'none';
            document.title = "DIYHRT MM";
            window.history.pushState(null, '', '/');
            document.querySelectorAll('.menu-link').forEach(link => link.classList.remove('active'));
        }

        // Handle Browser Back/Forward buttons
        window.addEventListener('popstate', (event) => {
            if (event.state && event.state.category) {
                loadPage(null, event.state.category, event.state.fileId, event.state.title);
            } else {
                goHome(null);
            }
        });
    </script>
</body>
</html>
