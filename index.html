<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DIYHRT MM</title>
    <style>
        :root {
            --bg-color: #0f0f11;
            --surface-color: #18181b;
            --border-color: #27272a;
            --text-main: #f4f4f5;
            --text-muted: #a1a1aa;
            --accent-yellow: #fde047;
            --accent-pink: #fb7185;
            --accent-green: #4ade80;
            --accent-blue: #60a5fa;
        }

        body {
            font-family: 'Padauk', 'Myanmar Text', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            min-height: 100vh;
        }

        /* Sidebar styling */
        nav {
            width: 300px;
            background-color: var(--surface-color);
            border-right: 1px solid var(--border-color);
            padding: 24px;
            box-sizing: border-box;
            flex-shrink: 0;
            overflow-y: auto;
        }

        .brand {
            font-size: 1.25rem;
            font-weight: bold;
            color: var(--accent-yellow);
            text-decoration: none;
            display: block;
            margin-bottom: 30px;
            letter-spacing: 0.5px;
        }

        .category-header {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--text-muted);
            margin: 24px 0 10px 0;
            font-weight: bold;
        }

        .menu-link {
            display: block;
            color: var(--text-main);
            text-decoration: none;
            padding: 10px 14px;
            border-radius: 8px;
            margin-bottom: 6px;
            font-size: 0.95rem;
            transition: all 0.2s ease;
            border: 1px solid transparent;
        }

        .menu-link:hover {
            background-color: rgba(255, 255, 255, 0.03);
            border-color: var(--border-color);
            color: var(--accent-yellow);
        }

        .menu-link.active {
            background-color: rgba(253, 224, 71, 0.08);
            border-color: rgba(253, 224, 71, 0.2);
            color: var(--accent-yellow);
        }

        /* Main view */
        main {
            flex-grow: 1;
            padding: 40px;
            max-width: 780px;
            margin: 0 auto;
            box-sizing: border-box;
        }

        .card {
            background-color: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 30px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }

        h1 {
            color: var(--accent-yellow);
            font-size: 1.4rem;
            margin-top: 0;
            margin-bottom: 24px;
            line-height: 1.4;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
        }

        /* Raw Text formatting inside card */
        pre {
            white-space: pre-wrap;
            word-wrap: break-word;
            font-family: inherit;
            font-size: 1rem;
            line-height: 1.7;
            color: var(--text-main);
            margin: 0;
        }

        .home-welcome {
            text-align: center;
            margin-top: 100px;
        }

        .home-welcome h2 {
            color: var(--accent-yellow);
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .home-welcome p {
            color: var(--text-muted);
        }

        /* Mobile responsiveness */
        @media (max-width: 768px) {
            body {
                flex-direction: column;
            }
            nav {
                width: 100%;
                border-right: none;
                border-bottom: 1px solid var(--border-color);
                padding: 20px;
                max-height: 250px;
            }
            main {
                padding: 20px;
            }
        }
    </style>
</head>
<body>

    <nav>
        <a href="/" class="brand" onclick="goHome(event)">DIYHRT MM</a>

        <div class="category-header">guide</div>
        <a href="/guide/01" class="menu-link" onclick="loadTxt(event, 'guide', '01', 'Transfeminine များအတွက် HRT (Hormone Replacement Therapy) Sublingual/Buccal လမ်းညွှန်အကျဉ်း')">Transfeminine များအတွက် HRT Sublingual/Buccal လမ်းညွှန်အကျဉ်း</a>

        <div class="category-header">about</div>
        <!-- Add links here when you create more categories and text files -->
    </nav>

    <main>
        <div id="home-view" class="home-welcome">
            <h2>DIYHRT MM</h2>
            <p>ဘယ်ဘက်မီနူးမှ လမ်းညွှန်စာမျက်နှာကို ရွေးချယ်ပါ</p>
        </div>

        <div id="content-view" style="display: none;">
            <div class="card">
                <h1 id="view-title"></h1>
                <pre id="view-text">Loading...</pre>
            </div>
        </div>
    </main>

    <script>
        async function loadTxt(event, category, fileId, title) {
            if (event) event.preventDefault();

            const homeView = document.getElementById('home-view');
            const contentView = document.getElementById('content-view');
            const viewTitle = document.getElementById('view-title');
            const viewText = document.getElementById('view-text');

            homeView.style.display = 'none';
            contentView.style.display = 'block';
            viewTitle.textContent = title;
            viewText.textContent = "ဖိုင်ကိုဖွင့်နေသည်...";
            document.title = title + " - DIYHRT MM";

            window.history.pushState({category, fileId, title}, '', `/${category}/${fileId}`);

            try {
                const response = await fetch(`/txt/${category}/${fileId}.txt`);
                if (!response.ok) throw new Error('File not found');
                const data = await response.text();
                viewText.textContent = data;
            } catch (err) {
                viewText.textContent = `ဖိုင်ကိုရှာမတွေ့ပါ (/txt/${category}/${fileId}.txt ဖိုင်ကိုထည့်သွင်းထားခြင်းရှိမရှိ စစ်ဆေးပါ)`;
            }

            document.querySelectorAll('.menu-link').forEach(l => l.classList.remove('active'));
            if (event && event.target) {
                event.target.classList.add('active');
            }
        }

        function goHome(event) {
            if (event) event.preventDefault();
            document.getElementById('home-view').style.display = 'block';
            document.getElementById('content-view').style.display = 'none';
            document.title = "DIYHRT MM";
            window.history.pushState(null, '', '/');
            document.querySelectorAll('.menu-link').forEach(l => l.classList.remove('active'));
        }

        window.addEventListener('popstate', (event) => {
            if (event.state && event.state.category) {
                loadTxt(null, event.state.category, event.state.fileId, event.state.title);
            } else {
                goHome(null);
            }
        });
    </script>
</body>
</html>
