<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DIYHRT MM</title>
    <style>
        :root {
            --bg: #111111;
            --surface: #1e1e1e;
            --text: #e0e0e0;
            --text-dim: #888888;
            --accent: #fde047; /* Yellow */
            --link: #60a5fa; /* Blue */
            --border: #333333;
        }

        body {
            font-family: 'Padauk', system-ui, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            line-height: 1.6;
            display: flex;
            min-height: 100vh;
        }

        /* Sidebar Navigation */
        nav {
            width: 280px;
            background-color: var(--surface);
            border-right: 1px solid var(--border);
            padding: 20px;
            box-sizing: border-box;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .brand {
            font-weight: bold;
            font-size: 1.2rem;
            color: var(--accent);
            text-decoration: none;
            margin-bottom: 30px;
            display: inline-block;
        }

        .category-title {
            text-transform: uppercase;
            font-size: 0.8rem;
            color: var(--text-dim);
            margin: 20px 0 10px 0;
            font-weight: bold;
            letter-spacing: 1px;
        }

        nav a.menu-link {
            display: block;
            color: var(--text);
            text-decoration: none;
            padding: 8px 12px;
            border-radius: 4px;
            margin-bottom: 4px;
            transition: background 0.2s;
            font-size: 0.95rem;
        }

        nav a.menu-link:hover, nav a.menu-link.active {
            background-color: rgba(255, 255, 255, 0.1);
            color: var(--accent);
        }

        /* Main Content Area */
        main {
            flex-grow: 1;
            padding: 40px;
            max-width: 800px;
            margin: 0 auto;
        }

        /* Home Page specific styles */
        #home-content {
            display: block;
        }

        #txt-content-wrapper {
            display: none;
        }

        /* Rendered Text Styling */
        pre {
            white-space: pre-wrap; /* Keeps formatting but wraps text */
            font-family: inherit;
            font-size: 1rem;
            color: var(--text);
            margin: 0;
        }

        /* Mobile view adjustments */
        @media (max-width: 768px) {
            body {
                flex-direction: column;
            }
            nav {
                width: 100%;
                border-right: none;
                border-bottom: 1px solid var(--border);
                padding: 15px;
            }
            main {
                padding: 20px;
            }
        }
    </style>
</head>
<body>

    <nav>
        <a href="/" class="brand" onclick="goHome(event)">DIYHRT MM</a>

        <div class="category-title">Guide</div>
        <a href="/guide/01" class="menu-link" onclick="loadPage(event, 'guide', '01', 'Transfeminine HRT Guide')">Transfeminine HRT Sublingual/Buccal</a>
        <a href="/guide/02" class="menu-link" onclick="loadPage(event, 'guide', '02', 'Blood Test Guide')">Blood Test လမ်းညွှန်ချက်များ</a>

        <div class="category-title">About</div>
        <a href="/about/01" class="menu-link" onclick="loadPage(event, 'about', '01', 'About & Contact')">ဆက်သွယ်ရန် / ဝယ်ယူရန်</a>
    </nav>

    <main>
        <!-- This shows when on the homepage -->
        <div id="home-content">
            <h1 style="color: var(--accent);">Welcome to DIYHRT MM</h1>
            <p style="color: var(--text-dim);">Select a guide from the menu to read the documentation.</p>
        </div>

        <!-- This shows when a text file is loaded -->
        <div id="txt-content-wrapper">
            <h1 id="page-title" style="color: var(--accent); margin-top: 0;"></h1>
            <pre id="text-container">Loading...</pre>
        </div>
    </main>

    <script>
        // Core Function to load .txt files
        async function loadPage(event, category, fileId, title) {
            if (event) event.preventDefault(); // Prevent full page reload

            const homeWrapper = document.getElementById('home-content');
            const txtWrapper = document.getElementById('txt-content-wrapper');
            const txtContainer = document.getElementById('text-container');
            const titleEl = document.getElementById('page-title');

            // Update UI State
            homeWrapper.style.display = 'none';
            txtWrapper.style.display = 'block';
            titleEl.textContent = title;
            txtContainer.textContent = "Loading file...";
            document.title = title + " - DIYHRT MM";

            // Update URL without reloading
            window.history.pushState({category, fileId, title}, '', `/${category}/${fileId}`);

            // Fetch the text file
            try {
                // Ensure your files are physically placed in a "txt" folder like: /txt/guide/01.txt
                const response = await fetch(`/txt/${category}/${fileId}.txt`);
                if (!response.ok) throw new Error('File not found on server.');
                
                const text = await response.text();
                txtContainer.textContent = text; // Securely inserts raw text, rendering URLs/brackets exactly as written.
            } catch (error) {
                txtContainer.textContent = "Error: Could not load the text file. Please make sure " + `/txt/${category}/${fileId}.txt` + " exists.";
            }

            // Update active state in menu
            document.querySelectorAll('.menu-link').forEach(link => link.classList.remove('active'));
            if(event && event.target) {
                event.target.classList.add('active');
            }
        }

        // Return to home state
        function goHome(event) {
            if (event) event.preventDefault();
            document.getElementById('home-content').style.display = 'block';
            document.getElementById('txt-content-wrapper').style.display = 'none';
            document.title = "DIYHRT MM";
            window.history.pushState(null, '', '/');
            document.querySelectorAll('.menu-link').forEach(link => link.classList.remove('active'));
        }

        // Handle Browser Back/Forward buttons
        window.addEventListener('popstate', (event) => {
            if (event.state && event.state.category) {
                loadPage(null, event.state.category, event.state.fileId, event.state.title);
            } else {
                goHome(null);
            }
        });
    </script>
</body>
</html>
