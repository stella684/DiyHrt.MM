<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>DIYHRT MM</title>
    <style>
        body { font-family: sans-serif; max-width: 800px; margin: auto; padding: 20px; background: #0d1117; color: #e6edf3; }
        a { color: #58a6ff; cursor: pointer; }
        .menu { margin-bottom: 20px; }
        .menu a { display: block; padding: 6px; }
        .menu a.active { color: #ff7b72; }
    </style>
</head>
<body>

    <img src="1785483123152.png" alt="logo" style="width:40px; height:40px; border-radius:8px;">
    <h1>DIYHRT MM</h1>

    <div id="menu" class="menu"></div>
    <div id="content"></div>

    <!-- Load your "txt" files as scripts -->
    <script src="txt/menu.js"></script>
    <script src="txt/01.js"></script>

    <script>
        // Build menu
        const menuDiv = document.getElementById('menu');
        const contentDiv = document.getElementById('content');

        function renderMenu() {
            if (!window.MENU) {
                menuDiv.innerHTML = '❌ menu.js not loaded.';
                return;
            }
            let html = '';
            window.MENU.forEach(section => {
                html += `<strong>${section.category}</strong><br>`;
                section.links.forEach(link => {
                    html += `<a onclick="loadPage('${link.fileId}')">${link.name}</a>`;
                });
            });
            menuDiv.innerHTML = html;
        }

        function loadPage(id) {
            if (window.PAGES && window.PAGES[id]) {
                // Very basic markdown: headings and bold
                let text = window.PAGES[id];
                text = text.replace(/^# (.+)$/gm, '<h1>$1</h1>');
                text = text.replace(/^## (.+)$/gm, '<h2>$1</h2>');
                text = text.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
                text = text.replace(/\n/g, '<br>');
                contentDiv.innerHTML = text;
            } else {
                contentDiv.innerHTML = '❌ Page not found.';
            }
        }

        renderMenu();
        // Load first page if any
        if (window.PAGES && Object.keys(window.PAGES).length) {
            loadPage(Object.keys(window.PAGES)[0]);
        }
    </script>

</body>
</html>
