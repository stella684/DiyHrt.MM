<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DIYHRT MM</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Padauk:wght@400;700&display=swap" rel="stylesheet" />

    <style>
        /* ── All styles exactly as before ── */
        :root {
            --bg: #0d1117;
            --surface: #161b22;
            --surface-hover: #21262d;
            --text-primary: #e6edf3;
            --text-secondary: #8b949e;
            --accent-blue: #58a6ff;
            --accent-pink: #ff7b72;
            --warning-bg: #4d3a00;
            --warning-text: #e3b341;
            --border: #30363d;
            --radius: 8px;
            --transition: 0.25s ease;
        }

        body {
            font-family: 'Inter', 'Padauk', system-ui, sans-serif;
            background-color: var(--bg);
            color: var(--text-primary);
            margin: 0;
            line-height: 1.7;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            overflow-x: hidden;
        }

        body.drawer-open {
            overflow: hidden;
        }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-secondary); }

        header {
            display: flex;
            align-items: center;
            height: 60px;
            background-color: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 0 20px;
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
            box-sizing: border-box;
        }

        .menu-btn {
            background: none;
            border: none;
            color: var(--text-primary);
            font-size: 26px;
            cursor: pointer;
            margin-right: 16px;
            padding: 4px 6px;
            border-radius: 6px;
            transition: background var(--transition);
        }
        .menu-btn:hover {
            background: var(--surface-hover);
        }

        .brand-container {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            cursor: pointer;
        }

        .brand-icon {
            width: 34px;
            height: 34px;
            border-radius: var(--radius);
            object-fit: cover;
            display: block;
            background: var(--surface-hover);
        }

        .brand-text {
            font-weight: 800;
            font-size: 1.4rem;
            background: linear-gradient(270deg, #ffffff, #8b949e, #ffffff, #e6edf3);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            display: inline-block;
            letter-spacing: -0.5px;
            animation: silverShine 4s ease infinite;
        }

        @keyframes silverShine {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .drawer-overlay {
            position: fixed;
            top: 60px;
            left: 0;
            width: 100vw;
            height: calc(100vh - 60px);
            background: rgba(0, 0, 0, 0.55);
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
            z-index: 899;
        }
        .drawer-overlay.visible {
            opacity: 1;
            visibility: visible;
        }

        nav {
            position: fixed;
            top: 60px;
            left: -300px;
            width: 300px;
            height: calc(100vh - 60px);
            background-color: var(--surface);
            border-right: 1px solid var(--border);
            padding: 24px 20px;
            box-sizing: border-box;
            transition: left 0.3s ease;
            z-index: 900;
            overflow-y: auto;
        }
        nav.open {
            left: 0;
        }

        .category-title {
            text-transform: uppercase;
            font-size: 0.7rem;
            color: var(--text-secondary);
            margin: 22px 0 10px 0;
            font-weight: 700;
            letter-spacing: 1.8px;
            opacity: 0.7;
        }

        nav a.menu-link {
            display: block;
            color: var(--text-primary);
            text-decoration: none;
            padding: 10px 14px;
            border-radius: 6px;
            margin-bottom: 4px;
            transition: all var(--transition);
            font-size: 0.95rem;
            border: 1px solid transparent;
            word-break: break-word;
        }
        nav a.menu-link:hover,
        nav a.menu-link.active {
            background-color: var(--surface-hover);
            border-color: var(--border);
            color: var(--accent-blue);
            transform: translateX(4px);
        }

        main {
            flex-grow: 1;
            padding: 100px 20px 50px 20px;
            max-width: 860px;
            margin: 0 auto;
            width: 100%;
            box-sizing: border-box;
        }

        .text-body p {
            margin-bottom: 1.2rem;
            color: #c9d1d9;
        }
        .alert-box {
            background-color: var(--warning-bg);
            color: var(--warning-text);
            padding: 16px 20px;
            border-radius: var(--radius);
            border-left: 4px solid var(--warning-text);
            margin-bottom: 25px;
            font-weight: 600;
        }
        h1.page-title {
            font-size: 2.2rem;
            color: var(--text-primary);
            margin: 0 0 32px 0;
            line-height: 1.3;
        }
        h2.section-title {
            color: var(--accent-blue);
            margin: 40px 0 20px 0;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border);
            font-size: 1.6rem;
        }
        h3.sub-title {
            color: var(--accent-pink);
            margin: 30px 0 15px 0;
            font-size: 1.2rem;
        }
        strong {
            color: #ffffff;
            font-weight: bold;
            background: rgba(255, 255, 255, 0.08);
            padding: 2px 8px;
            border-radius: 4px;
        }
        em {
            color: var(--accent-pink);
            font-style: italic;
        }
        .list-group {
            margin-bottom: 20px;
        }
        .list-item {
            margin-bottom: 6px;
            padding-left: 22px;
            position: relative;
            color: #c9d1d9;
        }
        .list-item::before {
            content: "•";
            position: absolute;
            left: 4px;
            color: var(--accent-blue);
            font-weight: bold;
        }
        a.external-link {
            color: var(--accent-blue);
            text-decoration: none;
            border-bottom: 1px dotted var(--accent-blue);
            transition: color 0.2s, border-color 0.2s;
        }
        a.external-link:hover {
            color: var(--accent-pink);
            border-bottom-color: var(--accent-pink);
        }

        .error-box {
            padding: 20px;
            background: rgba(255, 123, 114, 0.12);
            border: 1px solid var(--accent-pink);
            border-radius: var(--radius);
            color: var(--accent-pink);
        }
        .error-box strong {
            background: rgba(255, 123, 114, 0.2);
            color: #ffb3a8;
        }

        @media (min-width: 1024px) {
            header { display: none; }
            body { flex-direction: row; }
            .drawer-overlay { display: none !important; }
            nav {
                left: 0;
                top: 0;
                position: sticky;
                height: 100vh;
                border-right: 1px solid var(--border);
                width: 320px;
                padding: 32px 24px;
            }
            .desktop-brand {
                display: flex !important;
                align-items: center;
                gap: 14px;
                margin-bottom: 36px;
                cursor: pointer;
                padding: 4px 0;
            }
