<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DIYHRT MM</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Padauk:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg: #0d1117;
            --surface: #161b22;
            --surface-hover: #21262d;
            --text-primary: #e6edf3;
            --text-secondary: #8b949e;
            --accent-blue: #58a6ff;
            --accent-pink: #ff7b72;
            --warning-bg: #4d3a00;
            --warning-text: #e3b341;
            --border: #30363d;
        }

        body {
            font-family: 'Inter', 'Padauk', system-ui, sans-serif;
            background-color: var(--bg);
            color: var(--text-primary);
            margin: 0;
            line-height: 1.7;
            display: flex;
            min-height: 100vh;
            overflow-x: hidden;
        }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-secondary); }

        nav {
            width: 300px;
            background-color: var(--surface);
            border-right: 1px solid var(--border);
            padding: 24px;
            box-sizing: border-box;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            position: sticky;
            top: 0;
            height: 100vh;
        }

        .brand-container {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 30px;
            text-decoration: none;
            cursor: pointer;
        }

        .brand-icon {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            object-fit: cover;
        }

        .brand-text {
            font-weight: 800;
            font-size: 1.4rem;
            background: linear-gradient(90deg, var(--accent-blue), var(--accent-pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }

        .category-title {
            text-transform: uppercase;
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin: 20px 0 10px 0;
            font-weight: 700;
            letter-spacing: 1.5px;
        }

        nav a.menu-link {
            display: block;
            color: var(--text-primary);
            text-decoration: none;
            padding: 10px 14px;
            border-radius: 6px;
            margin-bottom: 6px;
            transition: all 0.2s ease;
            font-size: 0.95rem;
            border: 1px solid transparent;
        }

        nav a.menu-link:hover, nav a.menu-link.active {
            background-color: var(--surface-hover);
            border-color: var(--border);
            color: var(--accent-blue);
            transform: translateX(4px);
        }

        main {
            flex-grow: 1;
            padding: 50px;
            max-width: 850px;
            margin: 0 auto;
        }

        #home-content, #txt-content-wrapper { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Generated Text Styling */
        .text-body p { margin-bottom: 1.2rem; color: #c9d1d9; }
        
        .alert-box {
            background-color: var(--warning-bg);
            color: var(--warning-text);
            padding: 16px 20px;
            border-radius: 8px;
            border-left: 4px solid var(--warning-text);
            margin-bottom: 25px;
            font-weight: 600;
        }

        /* Headings */
        h1.page-title { font-size: 2.2rem; color: var(--text-primary); margin: 0 0 40px 0; line-height: 1.3; }
        h2.section-title { color: var(--accent-blue); margin: 40px 0 20px 0; padding-bottom: 10px; border-bottom: 1px solid var(--border); font-size: 1.6rem; }
        h3.sub-title { color: var(--accent-pink); margin: 30px 0 15px 0; font-size: 1.2rem; }

        /* Text Formatting */
        strong { color: #ffffff; font-weight: bold; background: rgba(255,255,255,0.1); padding: 2px 6px; border-radius: 4px; }
        em { color: var(--accent-pink); font-style: italic; }
        
        .list-group { margin-bottom: 20px; }
        .list-item { margin-bottom: 8px; padding-left: 20px; position: relative; color: #c9d1d9; }
        .list-item::before { content: "•"; position: absolute; left: 0; color: var(--accent-blue); font-weight: bold; }

        a.external-link { color: var(--accent-blue); text-decoration: none; border-bottom: 1px dotted var(--accent-blue); transition: color 0.2s; }
        a.external-link:hover { color: var(--accent-pink); border-bottom-color: var(--accent-pink); }

        @media (max-width: 800px) {
            body { flex-direction: column; }
            nav { width: 100%; height: auto; position: relative; border-right: none; border-bottom: 1px solid var(--border); }
            main { padding: 30px 20px; }
            h1.page-title { font-size: 1.8rem; }
        }
    </style>
</head>
<body>

    <nav>
        <div class="brand-container" onclick="goHome(event)">
            <img src="icon.png" alt="Icon" class="brand-icon" onerror="this.style.display='none'">
            <span class="brand-text">DIYHRT MM</span>
        </div>

        <div class="category-title">Guide</div>
        <a href="/guide/01" class="menu-link" onclick="loadPage(event, 'guide', '01', 'Transfeminine HRT Guide')">Transfeminine HRT Sublingual/Buccal</a>
        <a href="/guide/02" class="menu-link" onclick="loadPage(event, 'guide', '02', 'Blood Test လမ်းညွှန်ချက်များ')">Blood Test လမ်းညွှန်ချက်များ</a>

        <div class="category-title">About</div>
        <a href="/about/01" class="menu-link" onclick="loadPage(event, 'about', '01', 'ဆက်သွယ်ရန် / ဝယ်ယူရန်')">ဆက်သွယ်ရန် / ဝယ်ယူရန်</a>
    </nav>

    <main>
        <div id="home-content">
            <h1 style="color: var(--text-primary); font-size: 2.2rem; margin-top:0;">Welcome to DIYHRT MM</h1>
            <p style="color: var(--text-secondary); font-size: 1.1rem;">Select a guide from the menu to read the documentation.</p>
        </div>

        <div id="txt-content-wrapper" style="display:none;">
            <!-- The title now renders strictly from the # tag inside your text file! -->
            <div id="text-container" class="text-body">Loading...</div>
        </div>
    </main>

    <script>
        // THE MAGIC ENGINE: Translates your custom .txt markdown into HTML
        function parseMarkdownLite(text) {
            // 1. Color Tags: [color:red]text[/color] or [color:#ff7b72]text[/color]
            text = text.replace(/\[color:([^\]]+)\](.*?)\[\/color\]/gi, '<span style="color: $1;">$2</span>');
            
            // 2. Bold (**text**) and Italic (*text*)
            text = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            text = text.replace(/\*(.*?)\*/g, '<em>$1</em>');

            // 3. Auto-Links
            text = text.replace(/(?<!["'])(https?:\/\/[^\s\)]+)/g, '<a href="$1" class="external-link" target="_blank">$1</a>');

            // 4. Split document into block paragraphs by double-spacing
            let blocks = text.split(/\n{2,}/);
            
            let htmlBlocks = blocks.map(block => {
                block = block.trim();
                if (!block) return '';

                // Warning / Alert Boxes
                if (block.startsWith('⚠️')) {
                    return `<div class="alert-box">${block.replace(/\n/g, '<br>')}</div>`;
                }

                // Headers (# H1, ## H2, ### H3)
                if (block.startsWith('### ')) return `<h3 class="sub-title">${block.substring(4)}</h3>`;
                if (block.startsWith('## ')) return `<h2 class="section-title">${block.substring(3)}</h2>`;
                if (block.startsWith('# ')) return `<h1 class="page-title">${block.substring(2)}</h1>`;

                // Bullet Lists (Detects lines starting with - or •)
                if (block.match(/^[•\-]\s/m)) {
                    let listItems = block.split('\n').map(line => {
                        if (line.match(/^[•\-]\s/)) {
                            return `<div class="list-item">${line.replace(/^[•\-]\s+/, '')}</div>`;
                        }
                        return line;
                    }).join('');
                    return `<div class="list-group">${listItems}</div>`;
                }

                // Standard text paragraph
                return `<p>${block.replace(/\n/g, '<br>')}</p>`;
            });

            return htmlBlocks.join('\n\n');
        }

        async function loadPage(event, category, fileId, menuTitle) {
            if (event) event.preventDefault();

            const homeWrapper = document.getElementById('home-content');
            const txtWrapper = document.getElementById('txt-content-wrapper');
            const txtContainer = document.getElementById('text-container');

            homeWrapper.style.display = 'none';
            txtWrapper.style.display = 'block';
            txtContainer.innerHTML = "<p>Loading file...</p>";
            document.title = menuTitle + " - DIYHRT MM";

            window.history.pushState({category, fileId, menuTitle}, '', `/${category}/${fileId}`);

            try {
                const response = await fetch(`/txt/${category}/${fileId}.txt`);
                if (!response.ok) throw new Error('File not found');
                const rawText = await response.text();
                
                // Parse text using our new engine
                txtContainer.innerHTML = parseMarkdownLite(rawText);
            } catch (error) {
                txtContainer.innerHTML = `<div class="alert-box">Error: Could not load <strong>/txt/${category}/${fileId}.txt</strong></div>`;
            }

            document.querySelectorAll('.menu-link').forEach(link => link.classList.remove('active'));
            if(event && event.target) event.target.classList.add('active');
        }

        function goHome(event) {
            if (event) event.preventDefault();
            document.getElementById('home-content').style.display = 'block';
            document.getElementById('txt-content-wrapper').style.display = 'none';
            document.title = "DIYHRT MM";
            window.history.pushState(null, '', '/');
            document.querySelectorAll('.menu-link').forEach(link => link.classList.remove('active'));
        }

        window.addEventListener('popstate', (event) => {
            if (event.state && event.state.category) {
                loadPage(null, event.state.category, event.state.fileId, event.state.menuTitle);
            } else {
                goHome(null);
            }
        });
    </script>
</body>
</html>
