<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DIYHRT MM</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Padauk:wght@400;700&display=swap" rel="stylesheet" />

    <style>
        /* ── All your original styles ── */
        :root {
            --bg: #0d1117;
            --surface: #161b22;
            --surface-hover: #21262d;
            --text-primary: #e6edf3;
            --text-secondary: #8b949e;
            --accent-blue: #58a6ff;
            --accent-pink: #ff7b72;
            --warning-bg: #4d3a00;
            --warning-text: #e3b341;
            --border: #30363d;
            --radius: 8px;
            --transition: 0.25s ease;
        }

        body {
            font-family: 'Inter', 'Padauk', system-ui, sans-serif;
            background-color: var(--bg);
            color: var(--text-primary);
            margin: 0;
            line-height: 1.7;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            overflow-x: hidden;
        }

        body.drawer-open {
            overflow: hidden;
        }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-secondary); }

        header {
            display: flex;
            align-items: center;
            height: 60px;
            background-color: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 0 20px;
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
            box-sizing: border-box;
        }

        .menu-btn {
            background: none;
            border: none;
            color: var(--text-primary);
            font-size: 26px;
            cursor: pointer;
            margin-right: 16px;
            padding: 4px 6px;
            border-radius: 6px;
            transition: background var(--transition);
        }
        .menu-btn:hover {
            background: var(--surface-hover);
        }

        .brand-container {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            cursor: pointer;
        }

        .brand-icon {
            width: 34px;
            height: 34px;
            border-radius: var(--radius);
            object-fit: cover;
            display: block;
            background: var(--surface-hover);
        }

        .brand-text {
            font-weight: 800;
            font-size: 1.4rem;
            background: linear-gradient(270deg, #ffffff, #8b949e, #ffffff, #e6edf3);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            display: inline-block;
            letter-spacing: -0.5px;
            animation: silverShine 4s ease infinite;
        }

        @keyframes silverShine {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .drawer-overlay {
            position: fixed;
            top: 60px;
            left: 0;
            width: 100vw;
            height: calc(100vh - 60px);
            background: rgba(0, 0, 0, 0.55);
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
            z-index: 899;
        }
        .drawer-overlay.visible {
            opacity: 1;
            visibility: visible;
        }

        nav {
            position: fixed;
            top: 60px;
            left: -300px;
            width: 300px;
            height: calc(100vh - 60px);
            background-color: var(--surface);
            border-right: 1px solid var(--border);
            padding: 24px 20px;
            box-sizing: border-box;
            transition: left 0.3s ease;
            z-index: 900;
            overflow-y: auto;
        }
        nav.open {
            left: 0;
        }

        .category-title {
            text-transform: uppercase;
            font-size: 0.7rem;
            color: var(--text-secondary);
            margin: 22px 0 10px 0;
            font-weight: 700;
            letter-spacing: 1.8px;
            opacity: 0.7;
        }

        nav a.menu-link {
            display: block;
            color: var(--text-primary);
            text-decoration: none;
            padding: 10px 14px;
            border-radius: 6px;
            margin-bottom: 4px;
            transition: all var(--transition);
            font-size: 0.95rem;
            border: 1px solid transparent;
            word-break: break-word;
        }
        nav a.menu-link:hover,
        nav a.menu-link.active {
            background-color: var(--surface-hover);
            border-color: var(--border);
            color: var(--accent-blue);
            transform: translateX(4px);
        }

        main {
            flex-grow: 1;
            padding: 100px 20px 50px 20px;
            max-width: 860px;
            margin: 0 auto;
            width: 100%;
            box-sizing: border-box;
        }

        /* ─── Text content styles ─── */
        .text-body p {
            margin-bottom: 1.2rem;
            color: #c9d1d9;
            font-size: clamp(1rem, 2.5vw, 1.125rem);
            line-height: 1.8;
        }
        .alert-box {
            background-color: var(--warning-bg);
            color: var(--warning-text);
            padding: 16px 20px;
            border-radius: var(--radius);
            border-left: 4px solid var(--warning-text);
            margin-bottom: 25px;
            font-weight: 600;
            font-size: clamp(0.95rem, 2.2vw, 1.05rem);
        }
        h1.page-title {
            font-size: clamp(1.8rem, 5vw, 2.4rem);
            color: var(--text-primary);
            margin: 0 0 32px 0;
            line-height: 1.3;
        }
        h2.section-title {
            color: var(--accent-blue);
            margin: 40px 0 20px 0;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border);
            font-size: clamp(1.4rem, 4vw, 1.8rem);
        }
        h3.sub-title {
            color: var(--accent-pink);
            margin: 30px 0 15px 0;
            font-size: clamp(1.15rem, 3.5vw, 1.4rem);
        }
        strong {
            color: #ffffff;
            font-weight: bold;
            background: rgba(255, 255, 255, 0.08);
            padding: 2px 8px;
            border-radius: 4px;
        }
        em {
            color: var(--accent-pink);
            font-style: italic;
        }
        .list-group {
            margin-bottom: 20px;
        }
        .list-item {
            margin-bottom: 6px;
            padding-left: 22px;
            position: relative;
            color: #c9d1d9;
            font-size: clamp(0.95rem, 2.5vw, 1.05rem);
            line-height: 1.7;
        }
        .list-item::before {
            content: "•";
            position: absolute;
            left: 4px;
            color: var(--accent-blue);
            font-weight: bold;
        }
        a.external-link {
            color: var(--accent-blue);
            text-decoration: none;
            border-bottom: 1px dotted var(--accent-blue);
            transition: color 0.2s, border-color 0.2s;
        }
        a.external-link:hover {
            color: var(--accent-pink);
            border-bottom-color: var(--accent-pink);
        }

        .error-box {
            padding: 20px;
            background: rgba(255, 123, 114, 0.12);
            border: 1px solid var(--accent-pink);
            border-radius: var(--radius);
            color: var(--accent-pink);
        }
        .error-box strong {
            background: rgba(255, 123, 114, 0.2);
            color: #ffb3a8;
        }

        /* ─── Maintenance overlay ─── */
        #maintenance-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 99999;
            padding: 20px;
            box-sizing: border-box;
        }

        .maintenance-text {
            max-width: 800px;
            text-align: center;
            font-weight: 800;
            font-size: clamp(1.6rem, 6vw, 3rem);
            line-height: 1.5;
            background: linear-gradient(270deg, #ffffff, #8b949e, #ffffff, #e6edf3);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: silverShine 4s ease infinite;
            padding: 10px;
        }

        /* ─── Desktop overrides ─── */
        @media (min-width: 1024px) {
            header { display: none; }
            body { flex-direction: row; }
            .drawer-overlay { display: none !important; }
            nav {
                left: 0;
                top: 0;
                position: sticky;
                height: 100vh;
                border-right: 1px solid var(--border);
                width: 320px;
                padding: 32px 24px;
            }
            .desktop-brand {
                display: flex !important;
                align-items: center;
                gap: 14px;
                margin-bottom: 36px;
                cursor: pointer;
                padding: 4px 0;
            }
            .desktop-brand .brand-icon {
                width: 40px;
                height: 40px;
            }
            .desktop-brand .brand-text {
                font-size: 1.6rem;
            }
            main {
                padding: 60px 50px 50px 50px;
                margin-left: 0;
            }
        }

        @media (max-width: 1023px) {
            .desktop-brand { display: none !important; }
            main {
                padding: 90px 16px 40px 16px;
            }
        }

        @media (max-width: 480px) {
            .text-body p {
                font-size: 1rem;
                line-height: 1.8;
            }
            h1.page-title {
                font-size: 1.6rem;
            }
            h2.section-title {
                font-size: 1.3rem;
            }
            h3.sub-title {
                font-size: 1.1rem;
            }
            .list-item {
                font-size: 0.95rem;
            }
            .alert-box {
                font-size: 0.9rem;
                padding: 14px 16px;
            }
        }
    </style>
</head>
<body>

    <!-- Mobile Header -->
    <header>
        <button class="menu-btn" id="menu-btn" aria-label="Toggle navigation" aria-expanded="false" onclick="toggleDrawer()">☰</button>
        <div class="brand-container" onclick="goHome(event)">
            <img src="1785483123152.png" alt="Icon" class="brand-icon" />
            <span class="brand-text">DIYHRT MM</span>
        </div>
    </header>

    <!-- Overlay -->
    <div id="drawer-overlay" class="drawer-overlay" onclick="toggleDrawer(false)"></div>

    <!-- Side Navigation -->
    <nav id="drawer" aria-label="Sidebar Menu">
        <div class="desktop-brand" onclick="goHome(event)">
            <img src="1785483123152.png" alt="Icon" class="brand-icon" />
            <span class="brand-text">DIYHRT MM</span>
        </div>
        <div id="dynamic-menu-container"></div>
    </nav>

    <!-- Main Content -->
    <main>
        <div id="home-content">
            <h1 class="page-title" style="margin-top:0;">DIYHRT MMကနေကြိုဆိုပါတယ်</h1>
            <p style="color: var(--text-secondary); font-size: 1.15rem;">ဘေးကမျဥ်းလေး၃ကြောင်းကိုနှိပ်ပြီးဖတ်လိုရာကိုဖတ်လို့ရပါတယ်</p>
            <p style="color: var(--text-secondary); font-size: 1.15rem;">telegram group : https://t.me/trans_haven_myanmar</p>
            <p style="color: var(--text-secondary); font-size: 1.15rem;">document made by https://t.me/@Needy_Stella</p>
            <p style="color: var(--text-secondary); font-size: 1.15rem;">discord: stella684, Reddit: steIIa684</p>
        </div>

        <div id="txt-content-wrapper" style="display:none;">
            <article id="text-container" class="text-body"></article>
        </div>
    </main>

    <!-- ─── LOAD YOUR SEPARATE FILES AS SCRIPTS ─── -->
    <script src="txt/menu.js"></script>
    <script src="txt/01.js"></script>
    <script src="txt/02.js"></script>
    <script src="txt/03.js"></script>
    <script src="txt/04.js"></script>
    <script src="txt/05.js"></script>
    <script src="txt/06.js"></script>
    <script src="txt/07.js"></script>

    <script>
        // ─── MAINTENANCE MODE ──────────────────────────────────────────────
        let isMaintenance = false;

        async function checkMaintenance() {
            try {
                const res = await fetch('maintenance.txt?t=' + Date.now());
                if (!res.ok) return false;
                const txt = await res.text();
                const content = txt.trim().toLowerCase();
                if (content === 'true') {
                    isMaintenance = true;
                    showMaintenanceOverlay();
                }
            } catch (_) {
                // file not found or network error – assume not in maintenance
            }
        }

        function showMaintenanceOverlay() {
            const overlay = document.createElement('div');
            overlay.id = 'maintenance-overlay';
            overlay.innerHTML = `
                <div style="display:flex; flex-direction:column; align-items:center; gap:30px; max-width:800px; text-align:center; padding:20px;">
                    <div class="maintenance-text">
                        documents များကိုပြုပြင်ပြင်ဆင်မှု ပြောင်းလဲမှု ဖြည့်သွင်းမှု များလုပ်နေပါသဖြင့်<br>
                        documents များဖတ်လို့မရသေးပါဘူးရှင်
                    </div>
                    <a href="https://t.me/trans_haven_myanmar" target="_blank" rel="noopener noreferrer"
                       style="
                           display: inline-block;
                           background: var(--accent-blue, #58a6ff);
                           color: #0d1117;
                           font-family: 'Inter', 'Padauk', system-ui, sans-serif;
                           font-weight: 700;
                           font-size: clamp(1.1rem, 3vw, 1.4rem);
                           padding: 14px 40px;
                           border-radius: 40px;
                           text-decoration: none;
                           transition: all 0.3s ease;
                           box-shadow: 0 0 20px rgba(88, 166, 255, 0.3);
                           border: 1px solid rgba(255,255,255,0.1);
                           letter-spacing: 0.5px;
                       "
                       onmouseover="this.style.transform='scale(1.05)'; this.style.boxShadow='0 0 35px rgba(88,166,255,0.6)';"
                       onmouseout="this.style.transform='scale(1)'; this.style.boxShadow='0 0 20px rgba(88,166,255,0.3)';"
                    >
                        📢 Telegram Group
                    </a>
                </div>
            `;
            document.body.prepend(overlay);
        }

        // ─── NAVIGATION LOGIC ──────────────────────────────────────────────

        function toggleDrawer(forceState) {
            const drawer = document.getElementById('drawer');
            const overlay = document.getElementById('drawer-overlay');
            const isOpen = forceState !== undefined ? forceState : !drawer.classList.contains('open');
            drawer.classList.toggle('open', isOpen);
            if (overlay) overlay.classList.toggle('visible', isOpen);
            document.body.classList.toggle('drawer-open', isOpen && window.innerWidth < 1024);
        }

        function closeDrawerOnMobile() {
            if (window.innerWidth < 1024) toggleDrawer(false);
        }

        function goHome(event) {
            if (event) event.preventDefault();
            if (isMaintenance) return;
            window.location.hash = '';
        }

        function highlightActiveLink() {
            const current = window.location.hash;
            document.querySelectorAll('.menu-link').forEach(link => {
                link.classList.toggle('active', link.getAttribute('href') === current);
            });
        }

        function parseMarkdownLite(text) {
            let html = text;
            html = html.replace(/\[color:([^\]]+)\](.*?)\[\/color\]/gi, '<span style="color:$1;">$2</span>');
            html = html.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            html = html.replace(/\*(.*?)\*/g, '<em>$1</em>');
            html = html.replace(/(?<!["'])(https?:\/\/[^\s\)]+)/g,
                '<a href="$1" class="external-link" target="_blank" rel="noopener noreferrer">$1</a>'
            );
            const blocks = html.split(/\n{2,}/).map(b => b.trim()).filter(Boolean);
            const parsed = blocks.map(block => {
                if (block.startsWith('⚠️')) {
                    return `<div class="alert-box">${block.replace(/\n/g, '<br>')}</div>`;
                }
                if (block.startsWith('### ')) return `<h3 class="sub-title">${block.slice(4)}</h3>`;
                if (block.startsWith('## ')) return `<h2 class="section-title">${block.slice(3)}</h2>`;
                if (block.startsWith('# ')) return `<h1 class="page-title">${block.slice(2)}</h1>`;
                if (/^[•\-]\s/m.test(block)) {
                    const items = block.split('\n').map(line => {
                        if (/^[•\-]\s/.test(line)) {
                            return `<div class="list-item">${line.replace(/^[•\-]\s+/, '')}</div>`;
                        }
                        return line;
                    }).join('');
                    return `<div class="list-group">${items}</div>`;
                }
                return `<p>${block.replace(/\n/g, '<br>')}</p>`;
            });
            return parsed.join('\n\n');
        }

        function buildMenu() {
            const container = document.getElementById('dynamic-menu-container');
            container.innerHTML = '';

            if (!window.MENU) {
                container.innerHTML = `<div class="error-box">❌ Menu data not loaded. Make sure <strong>txt/menu.js</strong> exists and defines <strong>window.MENU</strong>.</div>`;
                return;
            }

            window.MENU.forEach(section => {
                let html = `<div class="category-title">${section.category}</div>`;
                section.links.forEach(link => {
                    html += `<a href="#/${link.fileId}" class="menu-link">${link.name}</a>`;
                });
                container.innerHTML += html;
            });
            highlightActiveLink();
        }

        function loadPage(fileId) {
            if (isMaintenance) return; // block page loading during maintenance

            const home = document.getElementById('home-content');
            const wrapper = document.getElementById('txt-content-wrapper');
            const container = document.getElementById('text-container');

            home.style.display = 'none';
            wrapper.style.display = 'block';

            if (!window.PAGES || !window.PAGES[fileId]) {
                container.innerHTML = `<div class="error-box">❌ Content for fileId <strong>${fileId}</strong> not found. Make sure <strong>txt/${fileId}.js</strong> exists and defines <strong>window.PAGES['${fileId}']</strong>.</div>`;
                return;
            }

            const content = window.PAGES[fileId];
            const titleMatch = content.match(/^#\s+(.+)$/m);
            document.title = titleMatch ? `${titleMatch[1]} — DIYHRT MM` : 'DIYHRT MM';

            container.innerHTML = parseMarkdownLite(content);
            closeDrawerOnMobile();
            highlightActiveLink();
        }

        function renderHome() {
            if (isMaintenance) return;
            document.getElementById('home-content').style.display = 'block';
            document.getElementById('txt-content-wrapper').style.display = 'none';
            document.getElementById('text-container').innerHTML = '';
            document.title = 'DIYHRT MM';
            highlightActiveLink();
            closeDrawerOnMobile();
        }

        function handleRoute() {
            if (isMaintenance) {
                // If maintenance is active, ignore any hash and stay on home (but overlay blocks everything)
                if (window.location.hash) {
                    window.location.hash = '';
                }
                return;
            }

            const hash = window.location.hash;
            if (!hash || hash === '#' || hash === '#/') {
                renderHome();
                return;
            }
            const fileId = hash.replace(/^#\//, '').trim();
            if (fileId) {
                loadPage(fileId);
            } else {
                renderHome();
            }
        }

        // ─── INIT ──────────────────────────────────────────────────────────

        window.addEventListener('hashchange', handleRoute);

        window.addEventListener('DOMContentLoaded', async () => {
            buildMenu();
            await checkMaintenance();   // wait for fetch
            handleRoute();              // now proceed (or blocked if maintenance)
        });
    </script>

</body>
</html>
